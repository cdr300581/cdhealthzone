<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2f5e9">
  <title>Reena's First Nutrition Anniversary</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5edcf;
      --muted: #c4d1c0;
      --paper: #071e18;
      --coral: #df5548;
      --green: #176940;
      --gold: #efc54e;
      --line: rgba(239, 197, 78, .28);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: #061a14;
      background-image:
        radial-gradient(ellipse at 50% -12%, rgba(205, 151, 38, .3), transparent 42%),
        radial-gradient(ellipse at 6% 46%, rgba(12, 94, 55, .48), transparent 39%),
        radial-gradient(ellipse at 100% 76%, rgba(163, 57, 31, .22), transparent 34%),
        linear-gradient(155deg, #061710 0%, #0b2c20 48%, #071811 100%),
        radial-gradient(rgba(239, 197, 78, .09) .7px, transparent .7px);
      background-size: auto, auto, auto, auto, 18px 18px;
      background-attachment: fixed;
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      display: grid;
      min-height: 100svh;
      place-items: center;
      width: min(1160px, calc(100% - 36px));
      margin: 0 auto;
      padding: clamp(18px, 4vw, 42px) 0;
    }

    .greeting-card {
      width: 100%;
      overflow: hidden;
      padding: clamp(12px, 2vw, 22px);
      border: 1px solid rgba(239, 197, 78, .62);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(10, 50, 33, .97), rgba(3, 20, 14, .98));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .48), 0 0 52px rgba(239, 197, 78, .14);
      animation: card-arrive .85s cubic-bezier(.2,.75,.25,1) both;
    }

    .card-visuals {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
      align-items: center;
      gap: clamp(10px, 1.7vw, 20px);
    }

    .cover-art, .slide-stage {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(239, 197, 78, .48);
      border-radius: 5px;
      background: #03140d;
    }

    .anniversary-gif {
      display: block;
      width: 100%;
      height: auto;
      background: #061a14;
    }

    .event-details {
      display: grid;
      grid-template-columns: minmax(170px, .75fr) minmax(0, 1.6fr);
      align-items: center;
      gap: 14px 22px;
      margin-top: clamp(12px, 2vw, 20px);
      padding: 12px clamp(4px, 1vw, 12px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-family: "Trebuchet MS", sans-serif;
    }

    .event-details p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(.82rem, 1.3vw, .98rem);
      line-height: 1.5;
    }

    .event-date { color: var(--gold) !important; font-weight: 700; }

    .storyboard-slideshow {
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .slide-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 4px 0;
      color: var(--muted);
      font-family: "Trebuchet MS", sans-serif;
      font-size: .82rem;
      line-height: 1.5;
    }

    .card-footer strong { color: var(--gold); }
    .storyboard-link { flex: 0 0 auto; color: var(--gold); font-weight: 700; }

    .music-pulse { display: inline-flex; height: 18px; align-items: center; gap: 3px; }
    .music-pulse span { width: 3px; height: 7px; border-radius: 2px; background: var(--gold); animation: beat-bar .42s ease-in-out infinite alternate; }
    .music-pulse span:nth-child(2) { animation-delay: .08s; }
    .music-pulse span:nth-child(3) { animation-delay: .16s; }
    .music-pulse span:nth-child(4) { animation-delay: .24s; }
    .music-pulse span:nth-child(5) { animation-delay: .32s; }

    @keyframes card-arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes beat-bar { to { height: 17px; background: #f7de89; } }
    @media (max-width: 760px) {
      .page { width: min(100% - 24px, 620px); }
      .card-visuals { grid-template-columns: 1fr; }
      .storyboard-slideshow { width: 100%; }
      .event-details { grid-template-columns: 1fr; gap: 6px; text-align: center; }
      .card-footer { align-items: flex-start; flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="greeting-card" aria-label="Reena's musical anniversary greeting card">
      <div class="card-visuals">
        <figure class="cover-art">
          <img class="anniversary-gif" src="images/ReenaNutritionCenterWritingCelebration.gif" alt="An animated anniversary greeting revealing Reena's Nutrition Center celebration and event details">
        </figure>

        <section class="storyboard-slideshow" aria-label="Anniversary storyboard slideshow">
          <figure class="slide-stage">
            <img class="slide-image" id="slideImage" src="images/storyboard-panels/opening-glitter-trail.png" alt="A golden trail of sparkling light on a green background">
          </figure>
        </section>
      </div>

      <section class="event-details" aria-label="Anniversary event details">
        <p class="event-date">10th October, Saturday | 8 AM - 10:30 AM</p>
        <p><strong>Activities:</strong> Healthy Breakfast | Result sharing | Fun activities</p>
      </section>

      <footer class="card-footer">
        <span><span class="music-pulse" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span> <strong>For Reena, with love.</strong></span>
        <a class="storyboard-link" href="reena-anniversary-previous.html">Classic slideshow layout</a>
        <a class="storyboard-link" href="anniversary-storyboard.html">All storyboard panels</a>
      </footer>
    </article>

  </main>

  <script>
    const slideImage = document.getElementById('slideImage');
    const storyboardSlides = [
      { src: 'images/storyboard-panels/opening-glitter-trail.png', alt: 'A golden trail of sparkling light on a green background' },
      { src: 'images/storyboard-panels/reena-r-appears.png', alt: 'The letter R beginning to form in gold script' },
      { src: 'images/storyboard-panels/reena-name.png', alt: "Reena's name in green and gold script" },
      { src: 'images/storyboard-panels/reenas-logo.png', alt: "Reena's Nutrition Center logo" },
      { src: 'images/storyboard-panels/nutrition-title.png', alt: "Reena's Nutrition title" },
      { src: 'images/storyboard-panels/nutrition-center-title.png', alt: "Reena's Nutrition Center title" },
      { src: 'images/storyboard-panels/first-anniversary-number.png', alt: 'A crowned first-anniversary numeral' },
      { src: 'images/storyboard-panels/anniversary-ribbon.png', alt: 'A red and gold anniversary ribbon' },
      { src: 'images/storyboard-panels/full-anniversary-title.png', alt: "Reena's Nutrition Center anniversary title" },
      { src: 'images/storyboard-panels/celebration-title.png', alt: "Reena's Nutrition Center anniversary celebration title" },
      { src: 'images/storyboard-panels/special-invitation.png', alt: 'Special invitation for the anniversary celebration' },
      { src: 'images/storyboard-panels/event-date-time.png', alt: 'Anniversary date and event time' },
      { src: 'images/storyboard-panels/activity-afresh-shake.png', alt: 'Afresh and nutrition shake activity card' },
      { src: 'images/storyboard-panels/activity-result-sharing.png', alt: 'Result sharing activity card' },
      { src: 'images/storyboard-panels/activity-wellness-topic.png', alt: 'Health and wellness topic activity card' },
      { src: 'images/storyboard-panels/activity-fun-fitness.png', alt: 'Fun and fitness activities card' },
      { src: 'images/storyboard-panels/closing-message.png', alt: 'Closing message: Come with your energy, leave with inspiration' }
    ];
    let currentSlide = 0;
    let slideshowTimer;
    let ambientContext;
    let ambientTimer;

    const showSlide = (slideIndex) => {
      currentSlide = (slideIndex + storyboardSlides.length) % storyboardSlides.length;
      const slide = storyboardSlides[currentSlide];
      slideImage.src = slide.src;
      slideImage.alt = slide.alt;
    };

    const playTone = (context, frequency, startAt, duration, volume, type) => {
      const oscillator = context.createOscillator();
      const envelope = context.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      envelope.gain.setValueAtTime(0.0001, startAt);
      envelope.gain.exponentialRampToValueAtTime(volume, startAt + 0.16);
      envelope.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
      oscillator.connect(envelope);
      envelope.connect(context.destination);
      oscillator.start(startAt);
      oscillator.stop(startAt + duration + 0.03);
    };

    const stopAmbientMusic = () => {
      if (ambientTimer) window.clearInterval(ambientTimer);
      ambientTimer = undefined;
      if (ambientContext) ambientContext.close();
      ambientContext = undefined;
    };

    const startAmbientMusic = async () => {
      const AudioContextType = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextType) throw new Error('Web Audio is unavailable');
      if (ambientContext?.state === 'running') return;
      stopAmbientMusic();
      ambientContext = new AudioContextType();
      await ambientContext.resume();
      if (ambientContext.state !== 'running') throw new Error('Browser audio autoplay is restricted');
      const chordProgression = [
        [261.63, 329.63, 392],
        [196, 246.94, 293.66],
        [220, 261.63, 329.63],
        [174.61, 220, 261.63]
      ];
      let chordIndex = 0;
      const scheduleChord = () => {
        if (!ambientContext) return;
        const context = ambientContext;
        const startAt = context.currentTime + 0.08;
        const chord = chordProgression[chordIndex % chordProgression.length];
        const beatDuration = 60 / 144;
        chord.forEach((frequency) => playTone(context, frequency, startAt, beatDuration * 4 - 0.08, 0.022, 'triangle'));
        const melody = [chord[2] * 2, chord[1] * 2, chord[0] * 2, chord[1] * 2];
        melody.forEach((frequency, beatIndex) => {
          const beatAt = startAt + beatIndex * beatDuration;
          playTone(context, chord[0] / 2, beatAt, 0.18, beatIndex === 0 ? 0.055 : 0.035, 'triangle');
          playTone(context, frequency, beatAt + 0.03, 0.25, 0.032, 'sine');
        });
        chordIndex++;
      };
      scheduleChord();
      ambientTimer = window.setInterval(scheduleChord, (60 / 144) * 4 * 1000);
    };

    const startMusicOnFirstInteraction = () => {
      if (ambientContext && ambientContext.state === 'running') return;
      startAmbientMusic().catch(() => {});
    };

    showSlide(0);
    slideshowTimer = window.setInterval(() => showSlide(currentSlide + 1), 1900);
    startAmbientMusic().catch(() => {});
    window.addEventListener('pointerdown', startMusicOnFirstInteraction, { once: true });
    window.addEventListener('keydown', startMusicOnFirstInteraction, { once: true });
    window.addEventListener('pagehide', stopAmbientMusic);
  </script>
</body>
</html>
